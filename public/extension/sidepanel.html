<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Olym AI Side Panel</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090d;
      color: #fafafa;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-weight: 800;
      color: #00ff88;
      font-size: 0.95rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .chat-box {
      flex: 1;
      background: #040406;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 6px;
    }
    .msg-user {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      align-self: flex-end;
    }
    .msg-olym {
      background: rgba(255, 255, 255, 0.05);
      color: #fafafa;
      align-self: flex-start;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      background: #040406;
      border: 1px solid #27272a;
      padding: 8px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }
    button {
      background: #00ff88;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">✦ Olym AI Companion</div>
    <div style="font-size: 0.72rem; color: #a1a1aa;">Chrome Side Panel</div>
  </div>

  <div class="card" id="pageContextCard">
    <strong>Active Context:</strong> <span id="activeUrl">Loading DOM context...</span>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg msg-olym">
      Hi! I am Olym AI companion running directly in your browser. Ask me anything about this page or execute a skill.
    </div>
  </div>

  <form class="input-row" id="chatForm">
    <input type="text" id="promptInput" placeholder="Ask Olym about this page..." />
    <button type="submit">Send</button>
  </form>

  <script>
    const chatBox = document.getElementById('chatBox');
    const promptInput = document.getElementById('promptInput');
    const activeUrl = document.getElementById('activeUrl');

    chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
      if (tabs[0]) {
        activeUrl.innerText = tabs[0].url;
      }
    });

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'msg msg-user';
      userMsg.innerText = text;
      chatBox.appendChild(userMsg);

      promptInput.value = '';

      setTimeout(() => {
        const olymMsg = document.createElement('div');
        olymMsg.className = 'msg msg-olym';
        olymMsg.innerText = `Analyzing DOM tree for ${activeUrl.innerText}...\n\nFound key content nodes. Executed skill task for "${text}".`;
        chatBox.appendChild(olymMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 600);
    });
  </script>
</body>
</html>
