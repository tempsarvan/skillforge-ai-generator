<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Olym AI Companion</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060608;
      color: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 0.95rem;
      color: #00ff88;
    }
    .badge {
      font-family: monospace;
      font-size: 0.7rem;
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      background: #00ff88;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .info {
      font-size: 0.8rem;
      color: #a1a1aa;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">✦ Olym AI Companion</div>
    <div class="badge">v1.0.0</div>
  </div>

  <div class="info">
    Olym AI is active on this tab. Click below to open the full Dia & Strawberry competitor AI Side Panel companion.
  </div>

  <button class="btn" id="openSidePanel">Open Olym AI Side Panel →</button>

  <script>
    document.getElementById('openSidePanel').addEventListener('click', async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (chrome.sidePanel && chrome.sidePanel.open) {
        chrome.sidePanel.open({ windowId: tab.windowId });
      } else {
        alert('Open Olym Side Panel from your Chrome Extension menu toolbar!');
      }
    });
  </script>
</body>
</html>
